[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  sandeepmistry/LoRa@^0.8.0
build_flags =
  -DLORA_SCK_PIN=21
  -DLORA_MISO_PIN=22
  -DLORA_MOSI_PIN=23
  -DLORA_CS_PIN=5
  -DLORA_RESET_PIN=4
  -DLORA_DIO0_PIN=35
  -DLORA_FREQUENCY_HZ=868000000L